name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'object-editor/crates/wc3-data/data/**'
      - 'object-editor/crates/wc3-data/examples/docs_sources.rs'
      - '.github/workflows/docs.yml'
      - 'vercel.json'
  pull_request:
    paths:
      - 'website/**'
      - 'object-editor/crates/wc3-data/data/**'
      - 'object-editor/crates/wc3-data/examples/docs_sources.rs'
      - '.github/workflows/docs.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run generate
      - run: bun run check
      - run: bun run build
      - run: bun run check:links
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: website/dist
          retention-days: 7
