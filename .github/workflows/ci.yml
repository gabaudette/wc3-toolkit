# Builds and tests. Formatting and linting run before each commit instead
# (lefthook.yml), so CI does not repeat them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  # Build-time libraries Tauri needs on Linux.
  TAURI_LINUX_DEPS: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: object-editor/app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $TAURI_LINUX_DEPS

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the frontend (the app crate embeds it)
        working-directory: object-editor/app
        run: bun install --frozen-lockfile && bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: object-editor
        run: cargo test --workspace
