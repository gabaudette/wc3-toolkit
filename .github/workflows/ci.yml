# Builds and tests. Formatting and linting run before each commit instead
# (lefthook.yml), so CI does not repeat them.
name: CI

# Pull requests run once (as pull_request); push only runs for main.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its run still going; main keeps a
# result for every merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  # No incremental builds in CI: nothing reuses them, and they bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: object-editor/app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Linux tests every crate but the app: the app needs WebKit and other
  # system libraries whose apt install alone took 12 to 17 minutes. Windows
  # needs none and tests everything; the pre-commit Clippy builds the app on
  # Linux.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            app: false
            crates: --workspace --exclude wc3-object-editor
          - os: windows-latest
            app: true
            crates: --workspace

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        if: matrix.app
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the frontend (the app crate embeds it)
        if: matrix.app
        working-directory: object-editor/app
        run: bun install --frozen-lockfile && bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the Cargo registry and target/ (dependencies and the bundled C
      # libraries), keyed by OS, toolchain and Cargo.lock.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: object-editor

      - name: Test
        working-directory: object-editor
        run: cargo test ${{ matrix.crates }}
