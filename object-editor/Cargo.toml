[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/casc", "crates/mpq", "crates/wc3-data", "crates/wc3-map"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/gabaudette/wc3-toolkit"

[workspace.lints.rust]
# Unsafe is a last resort: only the CascLib and StormLib wrappers (`ffi.rs`) and
# `platform.rs` allow it.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# AGE-ERR-003: crashing is a last resort. Tests may still unwrap (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# AGE-QUAL-003: every unsafe block documents why it is sound.
undocumented_unsafe_blocks = "warn"

# Rust equivalents of the AGE TypeScript baseline: no direct console output in
# libraries, numeric separators, no leftover debugging.
print_stdout = "warn"
print_stderr = "warn"
unreadable_literal = "warn"
dbg_macro = "warn"

# Debug info is most of target/'s size. Our code keeps file and line numbers,
# so panics and backtraces still point at the source.
[profile.dev]
debug = "line-tables-only"

# Dependencies (texture and PNG decoding) are optimized even in development
# builds, so the editor stays responsive while our own code compiles fast. Nobody
# steps through them in a debugger, so they carry no debug info.
[profile.dev.package."*"]
opt-level = 2
debug = false
