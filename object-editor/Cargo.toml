[workspace]
resolver = "3"
members = ["crates/casc", "crates/wc3-data"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/gabaudette/wc3-toolkit"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# AGE-ERR-003: crashing is a last resort. Tests may still unwrap (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# AGE-QUAL-003: every unsafe block documents why it is sound.
undocumented_unsafe_blocks = "warn"

# Rust equivalents of the AGE TypeScript baseline: no direct console output in
# libraries, numeric separators, no leftover debugging.
print_stdout = "warn"
print_stderr = "warn"
unreadable_literal = "warn"
dbg_macro = "warn"
