advanced = true
unverified = true

[[field]]
ids = ["bang", "rang"]
description = "Direction (degrees) new buildings face, and rooted Ancients. 270 faces the bottom of the screen."

[[field]]
ids = ["rzof", "rzoh"]
description = "Height of the rally point flag above the ground, in the classic and Reforged graphics."
advanced = true

[[field]]
ids = ["sant"]
description = "How animation speed follows unit scale. Rarely needs changing."
advanced = true
unverified = true

