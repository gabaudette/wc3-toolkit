[package]
name = "wc3-install"
description = "Finding Warcraft III installs, checking their data, and the choices Tinkerbench Setup hands to the app"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wc3-data = { path = "../wc3-data" }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
