[package]
name = "wc3-map"
description = "Warcraft III maps: object data, strings, and the game data with a map's changes applied"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mpq = { path = "../mpq" }
wc3-data = { path = "../wc3-data" }
thiserror = "2"
base64 = "0.22"
flate2 = "1"
full_moon = { version = "3", default-features = false, features = ["lua53"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
