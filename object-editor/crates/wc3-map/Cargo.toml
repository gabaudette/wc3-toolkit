[package]
name = "wc3-map"
description = "Warcraft III maps: object data, strings, and the game data with a map's changes applied"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mpq = { path = "../mpq" }
wc3-data = { path = "../wc3-data" }
thiserror = "2"
base64 = "0.22"
flate2 = "1"
full_moon = { version = "3", default-features = false, features = ["lua53"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
casc = { path = "../casc" }
mlua = { version = "0.12", features = ["lua53", "vendored"] }

[lints]
workspace = true
